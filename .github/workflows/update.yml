# The tracker's automatic update: every 4 hours, pipeline/update.mjs grabs the official sources, publishes what its checks prove, and
# commits the result to main (served by GitHub Pages from docs/). Runs one at a time. See pipeline/README.md, "How one update run writes".
#
# Manual runs default to a dry run (fetch and compare, promote nothing, no AI calls, Telegram report sent). Scheduled runs publish.
# Secrets: ANTHROPIC_API_KEY, CONGRESS_API_KEY, LEGISCAN_API_KEY, COURTLISTENER_API_TOKEN, PLURAL_API_KEY (Open States), NYSENATE_API_KEY,
# TELEGRAM_ACCESS_TOKEN, TELEGRAM_CHAT_ID,
# and optionally HEALTHCHECK_URL (an outside dead-man's switch, e.g. healthchecks.io, period 4 h + grace 4 h: it alerts when no run
# succeeds for 8 hours, which also catches a schedule GitHub stopped; the staleness alert below cannot, as it runs inside this workflow).
name: update

on:
  schedule:
    - cron: '17 */4 * * *' # 00:17, 04:17, ... UTC (off the hour, when GitHub's scheduler is less busy)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: fetch and compare only, publish nothing'
        type: boolean
        default: true

concurrency:
  group: tracker-update # never two runs at once; one more may wait (a third trigger replaces the waiting one)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history: update.mjs commits status.json alone at most once a day by reading its last commit date

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install
        working-directory: pipeline
        run: npm ci # no secrets in this step's environment

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Staleness alert (the last successful check is over 12 hours old)
        working-directory: pipeline
        env:
          TELEGRAM_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ACCESS_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          node -e "
            const s = JSON.parse(require('fs').readFileSync('../web/data/v2/status.json', 'utf8'));
            const t = Date.parse(s.last_checked); if (!Number.isFinite(t)) process.exit(4);
            const h = (Date.now() - t) / 36e5;
            if (h > 12) { console.log('STALE ' + h.toFixed(1) + 'h'); process.exit(3); }
          "
          rc=$?
          if [ $rc -eq 3 ]; then node notify/telegram.mjs --send "⚠️ US Frontier Law: the last successful check was over 12 hours ago (before this run). Check the Actions log." || true
          elif [ $rc -ne 0 ]; then echo "::warning::status.json is missing or unreadable (rc=$rc)"; fi
          exit 0

      - name: Update
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          PLURAL_API_KEY: ${{ secrets.PLURAL_API_KEY }}
          NYSENATE_API_KEY: ${{ secrets.NYSENATE_API_KEY }}
          TELEGRAM_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ACCESS_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$DRY" = "true" ]; then node update.mjs --dry-run --notify; else node update.mjs --commit; fi

      # Runs after a failed update too: a failed run still commits its spend counters (LegiScan queries, AI cost), which must reach main
      # or the monthly caps under-count. The job stays red when Update failed.
      - name: Push (only if main did not change data or the checking code meanwhile)
        if: ${{ !cancelled() && env.DRY != 'true' }}
        env:
          TELEGRAM_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ACCESS_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then echo "nothing committed"; exit 0; fi
          for attempt in 1 2; do
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$START_SHA" ]; then
              # Someone pushed to main during this run. If they touched site data, tracked lists, pipeline state, or the code that checks
              # the data (anything under pipeline/ or web/), this run's commit was checked against something no longer current: drop it;
              # the next run starts from the new main. Never rebase checked data onto changed data, never force-push. (No pipe here: under
              # pipefail a pipe into grep -q can fail on SIGPIPE and answer the unsafe way.)
              if ! git diff --quiet "$START_SHA" origin/main -- web pipeline docs/data; then
                echo "::warning::main changed data or the pipeline during this run; this run's commit is dropped and the next run starts fresh"
                (cd pipeline && node notify/telegram.mjs --send "⚠️ US Frontier Law: run ${GITHUB_RUN_ID} was dropped because main changed data or the pipeline meanwhile; its spend counters were not saved. The next run starts fresh.") || true
                exit 0
              fi
              git rebase origin/main || { git rebase --abort; echo "::error::rebase onto main conflicted; nothing pushed"; exit 1; }
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected; retrying once"
          done
          echo "::error::push failed twice"; exit 1

      - name: Heartbeat (outside dead-man's switch)
        if: ${{ success() && env.DRY != 'true' }}
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" > /dev/null || true; else echo "no HEALTHCHECK_URL set"; fi

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: pipeline/data/updates/*/run-report.json
          if-no-files-found: ignore
          retention-days: 30
