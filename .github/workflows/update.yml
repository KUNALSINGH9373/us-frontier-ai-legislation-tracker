# The tracker's automatic update: every 4 hours, pipeline/update.mjs grabs the official sources, publishes what its checks prove, and
# commits the result to main (served by GitHub Pages from docs/). Runs one at a time. See pipeline/README.md, "How one update run writes".
#
# Manual runs default to a dry run (fetch and compare, promote nothing, no AI calls, Telegram report sent). Scheduled runs publish.
# Secrets needed: ANTHROPIC_API_KEY, CONGRESS_API_KEY, LEGISCAN_API_KEY, COURTLISTENER_API_TOKEN, TELEGRAM_ACCESS_TOKEN, TELEGRAM_CHAT_ID.
name: update

on:
  schedule:
    - cron: '17 */4 * * *' # 00:17, 04:17, ... UTC (off the hour, when GitHub's scheduler is less busy)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: fetch and compare only, publish nothing'
        type: boolean
        default: true

concurrency:
  group: tracker-update # never two runs at once; a new run waits for the one in progress
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      TELEGRAM_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ACCESS_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history: update.mjs commits status.json alone at most once a day by reading its last commit date

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Install
        working-directory: pipeline
        run: npm ci

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Staleness alert (the last successful check is over 12 hours old)
        working-directory: pipeline
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('../web/data/v2/status.json', 'utf8'));
            const h = (Date.now() - Date.parse(s.last_checked)) / 36e5;
            if (h > 12) { console.log('STALE ' + h.toFixed(1) + 'h'); process.exit(3); }
          " || node notify/telegram.mjs --send "⚠️ US Frontier Law: the last successful check was over 12 hours ago (before this run). Check the Actions log." || true

      - name: Update
        working-directory: pipeline
        run: |
          if [ "$DRY" = "true" ]; then node update.mjs --dry-run --notify; else node update.mjs --commit; fi

      - name: Push (only if main did not change data meanwhile)
        if: env.DRY != 'true'
        run: |
          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then echo "nothing committed"; exit 0; fi
          for attempt in 1 2; do
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$START_SHA" ]; then
              # Someone pushed to main during this run. If they touched site data, tracked lists or pipeline state, this run's commit was
              # checked against data that is no longer current: drop it; the next run starts from the new main. Never rebase checked
              # data onto unchecked data, never force-push.
              if git diff --name-only "$START_SHA" origin/main -- web/data docs/data pipeline/config pipeline/state | grep -q .; then
                echo "::warning::main changed site data or state during this run; this run's commit is dropped and the next run starts fresh"
                exit 0
              fi
              git rebase origin/main
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected; retrying once"
          done
          echo "::error::push failed twice"; exit 1

      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: pipeline/data/updates/*/run-report.json
          if-no-files-found: ignore
          retention-days: 30
