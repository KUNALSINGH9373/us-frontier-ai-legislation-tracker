<!doctype html>
<html><head><meta charset="utf-8"><title>Statement</title><style>body{font:16px/1.4 sans-serif;margin:20px;background:#fff;color:#111}
.grad{background-image:linear-gradient(#003,#036);color:#fff;padding:4px}.shadow{filter:drop-shadow(1px 1px 1px #888)}.blend{mix-blend-mode:multiply}
.note{position:relative}.note::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:#ccc}</style></head>
<body><main><article><h1>Statement</h1><p>October 26, 2026</p>
<p class="grad">Gradient banner text.</p>
<p class="shadow">Drop shadow text.</p>
<p class="blend">Multiply blend text.</p>
<p class="note">Underlined by a pseudo element.</p>
<svg width="600" height="30"><text x="0" y="20" fill="#222" font-size="16">Visible SVG caption.</text></svg>
<p style="filter:brightness(0.9)">Slightly dimmed text.</p>
<p>"Lieu will introduce a licensing bill with $50 million penalties," said Lieu.</p>
<p>Closing visible paragraph.</p></article></main></body></html>
